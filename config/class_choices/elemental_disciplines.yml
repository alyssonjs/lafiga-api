# Disciplinas Elementais — Caminho dos Quatro Elementos (Monge) — D&D 5e PHB.
# Schema: api/config/class_choices/SCHEMA.md
#
# Slugs seguem o padrão `ed-*` (elemental discipline), 1:1 com o id do front
# (front-lafiga/src/app/data/monkDisciplines.ts → ElementalDiscipline.id).
#
# `cost` representa o custo em pontos de Chi:
#   integer  → custo fixo
#   variable → custo variável detalhado em mechanical_summary
#              (ex.: Shape the Flowing River usa 0 ou 1 Chi).
#
# Prereqs.level → nível mínimo de Monge (subclasse Caminho dos Quatro Elementos).
# O elemento (fire/water/earth/air/multi) NÃO é exposto no schema canônico — é
# metadado puramente visual mantido no fallback estático do front.
# `replicates_spell` (PHB) também é metadado descritivo embutido no
# mechanical_summary aqui — o cálculo de slot/efeito vive no engine de magias.

# === DISPONÍVEIS NO NÍVEL 3 ===

- slug: ed-fangs-of-fire-snake
  name_pt: Presas da Serpente de Fogo
  name_en: Fangs of the Fire Snake
  description: |
    Quando usa a ação Atacar, pode gastar 1 ponto de Chi para que ataques desarmados neste turno tenham alcance de 3m. Um acerto pode causar +1d10 de dano de fogo se você gastar 1 Chi adicional.
  mechanical_summary: "1 Chi: ataques desarmados 3m alcance + 1d10 fogo"
  cost: 1
  classes:
    - monk

- slug: ed-fist-of-four-thunders
  name_pt: Punho dos Quatro Trovões
  name_en: Fist of Four Thunders
  description: |
    Pode gastar 2 pontos de Chi para conjurar Onda Trovejante (Thunderwave).
  mechanical_summary: "2 Chi: Onda Trovejante (2d8 trovão)"
  cost: 2
  classes:
    - monk

- slug: ed-fist-of-unbroken-air
  name_pt: Punho do Ar Contínuo
  name_en: Fist of Unbroken Air
  description: |
    Cria explosão de ar comprimido. Ação, criatura a até 9m: 3d10 de dano contundente + empurrada 6m + knocked prone (TR FOR = metade, sem empurrão). +1d10 por Chi extra (máx 3).
  mechanical_summary: "2+ Chi: 3d10 contundente + empurrão 6m + derruba"
  cost: 2
  classes:
    - monk

- slug: ed-rush-of-gale-spirits
  name_pt: Investida dos Espíritos da Ventania
  name_en: Rush of the Gale Spirits
  description: |
    Pode gastar 2 pontos de Chi para conjurar Rajada de Vento (Gust of Wind).
  mechanical_summary: "2 Chi: Rajada de Vento (linha 18m, empurra)"
  cost: 2
  classes:
    - monk

- slug: ed-shape-the-flowing-river
  name_pt: Moldar o Rio Corrente
  name_en: Shape the Flowing River
  description: |
    Ação: gasta 1 ponto de Chi para remodelar gelo↔água numa área de até 9m² a até 36m (erguer/baixar elevação, escavar valas, erguer paredes ou pilares). Utilitário — não pode aprisionar nem ferir criaturas.
  mechanical_summary: "1 Chi: remodela gelo/água (utilitário)"
  cost: 1
  classes:
    - monk

- slug: ed-sweeping-cinder-strike
  name_pt: Golpe de Varredura Cauterizante
  name_en: Sweeping Cinder Strike
  description: |
    Pode gastar 2 pontos de Chi para conjurar Mãos Flamejantes (Burning Hands).
  mechanical_summary: "2 Chi: Mãos Flamejantes (3d6 fogo, cone 4.5m)"
  cost: 2
  classes:
    - monk

- slug: ed-water-whip
  name_pt: Chicote de Água
  name_en: Water Whip
  description: |
    Ação, criatura a até 9m: 3d10 de dano contundente + pode puxá-la 7.5m em direção a você ou derrubá-la (TR DES = metade, sem efeito). +1d10 por Chi extra (máx 3).
  mechanical_summary: "2+ Chi: 3d10 contundente + puxa 7.5m ou derruba"
  cost: 2
  classes:
    - monk

- slug: ed-clench-of-north-wind
  name_pt: Serragem do Vento do Norte
  name_en: Clench of the North Wind
  description: |
    Pode gastar 3 pontos de Chi para conjurar Imobilizar Pessoa (Hold Person).
  mechanical_summary: "3 Chi: Imobilizar Pessoa (paralisa, TR SAB)"
  cost: 3
  classes:
    - monk
  prereqs:
    level: 6

- slug: ed-gong-of-summit
  name_pt: Gongo do Pico
  name_en: Gong of the Summit
  description: |
    Pode gastar 3 pontos de Chi para conjurar Despedaçar (Shatter).
  mechanical_summary: "3 Chi: Despedaçar (3d8 trovão, esfera 3m)"
  cost: 3
  classes:
    - monk
  prereqs:
    level: 6

