creation:
- id: era-0
  title: O Vazio Consciente
  subtitle: Antes do Tempo
  period: Pre-existencia
  narrative: 'Antes de haver "antes", existia Aethon — nao como um ser, mas como uma
    possibilidade. O Vazio nao era vazio: era potencial puro, infinito e indeciso.'
  details:
  - Aethon nao "decide" criar — a criacao emerge dele como sonhos emergem do sono.
  - Os cosmologos de Lafiga chamam a este estado "A Noite Sem Estrelas".
  keyFigures:
  - Aethon
  accentColor: var(--lf-text-subtle)
- id: era-1
  title: O Primeiro Sonho
  subtitle: A Criacao dos Guardioes
  period: Era Zero
  narrative: Aethon "sonhou" — e desse sonho nasceram os Asthrsherans, os primeiros
    seres conscientes. Cada um dos 7 incorporou um aspecto fundamental da realidade.
  details:
  - Os 7 Asthrsherans nao se "lembram" da sua criacao.
  - Khael'thar nasceu das possibilidades rejeitadas.
  keyFigures:
  - Aethon
  - Os 7 Asthrsherans
  - Khael'thar
  accentColor: var(--lf-arcane)
- id: era-2
  title: A Separacao dos Planos
  subtitle: Estrutura do Multiverso
  period: Era Primordial
  narrative: 'Os Asthrsherans comecaram a dar forma ao caos. Assim nasceram os planos:
    o Material como eixo central, os Elementais como materia-prima, o Astral como
    tecido conectivo.'
  details:
  - O Plano Material foi o primeiro a solidificar-se.
  - O Feywild e o Shadowfell surgiram como reflexos emparelhados.
  keyFigures:
  - Asthrsheran do Espaco
  - Asthrsheran do Tempo
  accentColor: var(--lf-info-blue)
- id: era-3
  title: O Despertar dos Deuses
  subtitle: O Panteao Nasce
  period: Era Divina
  narrative: A energia da criacao cristalizou-se em seres de imenso poder — os deuses.
    Solarius foi o primeiro, trazendo a luz.
  details:
  - Solarius trouxe a luz e separou o dia da noite.
  - Xaroth e considerado um "acidente divino".
  keyFigures:
  - Solarius
  - Lunara
  - Korrath
  - Mordekai
  - Xaroth
  accentColor: var(--lf-gold)
- id: era-4
  title: A Criacao dos Mortais
  subtitle: Racas e Civilizacoes
  period: Era dos Primeiros
  narrative: Os deuses decidiram preencher o Plano Material com vida inteligente.
    Num acto coletivo, todos os 12 deuses contribuiram para criar as racas mortais.
  details:
  - Os Elfos foram moldados por Lunara e Sylvara.
  - Os Humanos foram o "compromisso" — todos os deuses contribuiram.
  keyFigures:
  - Sylvara
  - Velmira
  - Pyrakos
  - Lunara
  accentColor: var(--lf-success)
- id: era-5
  title: A Primeira Ameaca
  subtitle: Vorthek e a Guerra Primordial
  period: Era da Ruptura
  narrative: Vorthek, o Devorador de Estrelas, estendeu os seus tentaculos desde o
    Far Realm. Os Asthrsherans e os deuses lutaram juntos, contendo-o mas sem o destruir.
  details:
  - A Guerra Primordial e o unico evento em que Asthrsherans e deuses lutaram lado
    a lado.
  - Vorthek foi contido, nao morto.
  keyFigures:
  - Vorthek
  - Os 7 Asthrsherans
  - Solarius
  accentColor: var(--lf-cancel-red)
- id: era-6
  title: A Era dos Reinos
  subtitle: Civilizacao e Conflito
  period: Era Actual
  narrative: Com Vorthek contido, os mortais ficaram "sozinhos". Construiram reinos,
    declararam guerras, fundaram guildas. Os aventureiros sao a resposta mortal as
    ameacas.
  details:
  - O continente tem 7 reinos maiores.
  - Os Cultos de Xaroth operam nas sombras.
  - Os Asthrsherans observam... e esperam.
  keyFigures:
  - Os mortais
  - A Guilda dos Aventureiros
  accentColor: var(--lf-orange)
asthrsherans:
- id: ast-01
  name: Chronael
  title: O Relojoeiro Silencioso
  aspect: Tempo
  description: Guardiao do fluxo temporal. Chronael garante que o tempo avanca num
    unico sentido e que paradoxos temporais nao destroem a realidade.
  lore: Chronael nao "vive" no tempo como os mortais — existe em todos os momentos
    simultaneamente. Aparece como uma figura imovel, sem rosto, rodeada por engrenagens
    visiveis que giram em velocidades impossiveis. Diz-se que quando uma magia de
    manipulacao temporal e lancada, Chronael "nota" — e se a distorcao for demasiado
    grande, intervem subtilmente, criando o que os magos chamam de "deslizamentos
    temporais". Os monges da Ordem Temporal dedicam a vida a estudar e proteger os
    pontos do Plano Material onde o tempo e mais fragil.
  abilities:
  - Manipulacao temporal absoluta
  - Presciencia infinita
  - Congelamento do tempo
  - Restauracao de paradoxos
  weakness: Nao pode alterar eventos que ja foram "observados" por multiplas consciencias
    — a realidade partilhada resiste.
  status: Activo
  accentColor: var(--lf-info-blue)
- id: ast-02
  name: Vasthari
  title: A Tecela de Horizontes
  aspect: Espaco
  description: Guardia das distancias e das fronteiras entre planos. Vasthari definiu
    o "onde" do multiverso.
  lore: Vasthari e descrita como uma mulher de quatro bracos, cada um apontando para
    um ponto cardinal de um compasso que nao existe. E ela quem mantem os planos separados
    — as barreiras entre o Material e o Feywild, entre o Astral e os Exteriores, sao
    a sua obra. Quando portais se abrem entre planos, Vasthari "permite". Os locais
    onde os planos se tocam (crossings) sao os pontos mais finos do seu tecido, e
    por isso os mais vigiados.
  abilities:
  - Distorcao espacial
  - Criacao/destruicao de portais
  - Manutencao de fronteiras planares
  - Teleportacao ilimitada
  weakness: E vulneravel onde os planos ja sao naturalmente finos — Crossings e Thin
    Points.
  status: Activo
  accentColor: var(--lf-arcane)
- id: ast-03
  name: Vitara
  title: A Semente Eterna
  aspect: Vida
  description: Guardia de toda a vida no multiverso. Vitara e a forca que impulsiona
    a germinacao, o crescimento e a reproducao de todos os seres vivos.
  lore: 'Vitara e a mais "presente" dos Asthrsherans — a sua influencia e sentida
    em cada nascimento, em cada flor que abre, em cada criatura que respira pela primeira
    vez. Nao tem forma fixa: aparece como raizes, como luz solar, como o choro de
    um recem-nascido. Os druidas acreditam que Sylvara (deusa da natureza) e uma manifestacao
    parcial de Vitara.'
  abilities:
  - Geracao de vida
  - Cura universal
  - Aceleracao de crescimento
  - Ressurreicao em escala cosmica
  weakness: Nao pode criar vida "do nada" — precisa de materia pre-existente e energia
    de Solhara.
  status: Activo
  accentColor: var(--lf-success)
- id: ast-04
  name: Morthaen
  title: O Porteiro do Fim
  aspect: Morte
  description: Guardiao do ciclo de morte e transicao das almas. Morthaen garante
    que a morte e definitiva e que as almas chegam ao destino correcto.
  lore: Morthaen e o complemento de Vitara — enquanto ela da vida, ele recolhe-a.
    Aparece como uma sombra longa sem corpo que a projete. Trabalha em tandem com
    Mordekai (deus da morte), mas enquanto Mordekai julga as almas, Morthaen garante
    que o processo funciona. Os liches sao a sua maior afronta.
  abilities:
  - Recolha de almas
  - Dissolucao de mortos-vivos
  - Transicao planar de espiritos
  - Selagem de almas fugitivas
  weakness: Liches com phylacteries estao parcialmente fora do seu alcance — a alma
    esta "escondida".
  status: Activo
  accentColor: var(--lf-text-subtle)
- id: ast-05
  name: Axiomar
  title: O Arquitecto das Leis
  aspect: Ordem
  description: Guardiao das leis fundamentais da realidade. Axiomar define as constantes
    do multiverso — gravidade, causalidade, logica.
  lore: Axiomar e o mais "rigido" dos Asthrsherans. Nao tem personalidade no sentido
    mortal — e pura estrutura. As leis da fisica, a logica matematica, a relacao entre
    accao e consequencia — tudo isso e Axiomar. Sem ele, o fogo poderia congelar,
    a gravidade poderia inverter-se. Os Modrons de Mechanus sao expressoes autonomas
    da mesma forca.
  abilities:
  - Definicao de constantes fisicas
  - Imposicao de causalidade
  - Supressao de anomalias
  - Estabilizacao planar
  weakness: O Caos e a sua contraparte — nao pode eliminar o caos sem eliminar a possibilidade
    de mudanca.
  status: Activo
  accentColor: var(--lf-gold)
- id: ast-06
  name: Entropia
  title: A Danca do Imprevisto
  aspect: Caos
  description: Guardia do caos, da mudanca e da imprevisibilidade. Entropia garante
    que a realidade nunca se torna completamente deterministica.
  lore: Entropia e a contraparte de Axiomar — e tambem a mais "divertida" dos Asthrsherans.
    E ela que garante que mutacoes acontecem, que eventos improvaveis ocorrem, que
    a Magia Selvagem existe. Os Slaadi do Limbo sao filhos indirectos de Entropia,
    e Zephyra (deusa da sorte) canaliza involuntariamente a sua forca.
  abilities:
  - Geracao de aleatoriedade
  - Mutacao de realidade
  - Disrupcao de padroes
  - Criacao de possibilidades
  weakness: Nao pode destruir a Ordem — so pode desafia-la. O equilibrio entre ambos
    e inviolavel.
  status: Adormecido
  accentColor: var(--lf-orange)
- id: ast-07
  name: Arcanis
  title: O Tecelao do Weave
  aspect: Magia
  description: Guardiao da magia em todas as suas formas. Arcanis e o ser que mantem
    o Weave — a teia mistica que permite a conjuracao em todo o multiverso.
  lore: Arcanis e talvez o Asthrsheran mais "visivel" — cada vez que uma magia e lancada,
    o Weave vibra. Vaelkris (deus da magia) e o seu principal intermediario. Diz-se
    que Arcanis foi gravemente ferido na Guerra Primordial contra Vorthek, e que as
    "zonas mortas de magia" que existem em Lafiga sao cicatrizes no Weave que nunca
    curaram.
  abilities:
  - Manutencao do Weave
  - Concessao de poder arcano
  - Supressao de magia selvagem
  - Restauracao de zonas mortas
  weakness: As feridas da Guerra Primordial — zonas mortas de magia persistem como
    cicatrizes.
  status: Ferido
  accentColor: var(--lf-cancel-red)
