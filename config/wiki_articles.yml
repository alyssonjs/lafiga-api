---
planes:
- id: pl-01
  name: Plano Material
  alias: O Mundo Mortal
  description: O plano central onde se desenrola a maior parte das aventuras. Lafiga,
    os seus reinos, cidades e masmorras existem aqui.
  longDescription: O Plano Material e o eixo em torno do qual todos os outros planos
    orbitam. E um mundo de contrastes — florestas antigas, desertos impiedosos, montanhas
    que tocam as nuvens e oceanos sem fim. A magia flui naturalmente, mas nao domina.
    Os mortais — humanos, elfos, anoes, halflings e dezenas de outras racas — constroem
    civilizacoes, guerreiam e sonham. E aqui que os deuses Lafigardianos projectam
    a sua influencia, e e aqui que os herois nascem.
  inhabitants:
  - Humanos
  - Elfos
  - Anoes
  - Halflings
  - Draconatos
  - Tieflings
  - Gnomes
  - Meia-Elfos
  - Meia-Orcs
  dangers:
  - Guerras entre reinos
  - Masmorras ancestrais
  - Dragoes territoriais
  - Cultos sombrios
  traits:
  - Magia natural
  - Gravidade normal
  - Tempo linear
  image: https://images.unsplash.com/photo-1596968654418-7973f1d59632?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxhdXR1bW4lMjBmb3Jlc3QlMjBmYWlyeSUyMGVuY2hhbnRlZCUyMHN1bmxpZ2h0fGVufDF8fHx8MTc3MzE1ODM5NHww&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral
  accentColor: var(--lf-success)
- id: pl-02
  name: Feywild
  alias: O Plano Feerico
  description: Uma versao exuberante e magica do Plano Material. As emocoes sao amplificadas,
    o tempo passa de forma imprevisivel e as criaturas feylidas governam cortes caprichosas.
  longDescription: 'O Feywild e um reflexo distorcido do Plano Material — mais brilhante,
    mais vibrante, mais perigoso. Florestas crescem ate alturas impossiveis, flores
    brilham com luz propria e rios cantam melodias encantadas. E governado pelas Cortes
    — a Corte do Verao (Titania) e a Corte do Inverno (a Rainha das Neves). O tempo
    no Feywild e traicoeiro: um dia aqui pode ser um seculo no Plano Material, ou
    vice-versa. Os viajantes regressam mudados, enfeiticados ou simplesmente... nao
    regressam.'
  inhabitants:
  - Eladrin
  - Fadas
  - Satiros
  - Dríades
  - Hags (parte)
  - Centauros feericos
  - Archfey
  dangers:
  - Perda de tempo
  - Encantamentos involuntarios
  - Contratos feericos
  - Caprichos dos Archfey
  traits:
  - Magia amplificada
  - Tempo instavel
  - Emocoes intensificadas
  image: https://images.unsplash.com/photo-1596968654418-7973f1d59632?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxhdXR1bW4lMjBmb3Jlc3QlMjBmYWlyeSUyMGVuY2hhbnRlZCUyMHN1bmxpZ2h0fGVufDF8fHx8MTc3MzE1ODM5NHww&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral
  accentColor: var(--lf-success)
- id: pl-03
  name: Shadowfell
  alias: O Plano das Sombras
  description: O reflexo sombrio do Plano Material. Um mundo de escuridao, melancolia
    e morte. A cor e a esperanca sao sugadas pela propria realidade.
  longDescription: O Shadowfell e o eco escuro do mundo — tudo aqui e mais cinzento,
    mais frio, mais morto. Ruinas de cidades que existem no Material erguem-se como
    esqueletos de pedra. A luz e fraca e difusa, como um eterno crepusculo. A emocao
    dominante e o desespero; viajantes prolongados podem cair em apatia profunda.
    E o lar dos mortos-vivos, dos shadar-kai (servos da Rainha Corvo) e da propria
    Rainha Corvo, divindade da morte e do destino. Em Lafiga, o Shadowfell e onde
    as almas transitam antes de chegar ao dominio do deus que serviram.
  inhabitants:
  - Shadar-kai
  - Mortos-vivos
  - Sombras
  - Espectros
  - Vampiros
  - A Rainha Corvo (divindade)
  dangers:
  - Desespero sobrenatural
  - Mortos-vivos errantes
  - Perda de vitalidade
  - Domínios do Medo
  traits:
  - Luz reduzida
  - Emocoes suprimidas
  - Necromancia amplificada
  image: https://images.unsplash.com/photo-1576095318448-5a3dc29d535a?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxzaGFkb3clMjBkYXJrJTIwbWlzdCUyMGVlcmllJTIwY2VtZXRlcnl8ZW58MXx8fHwxNzczMTU4MzkzfDA&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral
  accentColor: var(--lf-text-subtle)
- id: pl-04
  name: Planos Elementais
  alias: Os Quatro Reinos
  description: Quatro planos de pura energia elemental — Fogo, Agua, Terra e Ar. Na
    fronteira entre eles existe o Caos Elemental.
  longDescription: Os Planos Elementais sao reinos de materia pura. O Plano do Fogo
    e um inferno de lavas e chamas eternas, governado por efreets; o da Agua e um
    oceano infinito sem superficie, lar dos marid; o da Terra e um labirinto de cavernas
    e cristais, dominio dos dao; e o do Ar e um ceu sem fim de tempestades e serenidade,
    governado pelos djinn. Na interseccao caótica dos quatro existe o Caos Elemental,
    onde materia e energia colidem sem logica. Elementais de todas as formas nascem
    e morrem aqui num ciclo eterno.
  inhabitants:
  - Efreets
  - Marid
  - Dao
  - Djinn
  - Elementais
  - Genasi (originarios)
  - Mephits
  dangers:
  - Ambiente letal
  - Elementais hostis
  - Caos Elemental
  - Falta de ar/chao/estabilidade
  traits:
  - Materia elemental pura
  - Sem ciclo dia/noite
  - Magia elemental amplificada
  image: https://images.unsplash.com/photo-1760367112859-f595cd20e2a3?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHx2b2xjYW5pYyUyMGxhbmRzY2FwZSUyMGZpcmUlMjBsYXZhfGVufDF8fHx8MTc3MzE1ODM4OHww&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral
  accentColor: var(--lf-orange)
- id: pl-05
  name: Plano Astral
  alias: O Mar Prateado
  description: Um vazio infinito de luz prateada que conecta todos os planos. Corpos
    astrais de viajantes flutuam entre ilhas de realidade.
  longDescription: O Plano Astral e o "entre" — o tecido que liga todos os planos
    de existencia. E um vazio infinito de luz prateada e suave, sem gravidade, sem
    fome, sem envelhecimento. Viajantes flutuam como pensamentos, movendo-se pela
    forca da vontade. Aqui encontram-se os restos de deuses mortos — corpos titanicos
    que flutuam como ilhas de materia, colonizados por criaturas oportunistas. Os
    githyanki construiram o seu imperio neste plano, usando navios astrais para raiar
    planetas inteiros. Em Lafiga, o Plano Astral e onde os Asthrsherans meditam entre
    intervencoes.
  inhabitants:
  - Githyanki
  - Corpos de deuses mortos
  - Asthrsherans (em transito)
  - Couatls astrais
  dangers:
  - Githyanki hostis
  - Perda de orientacao
  - Turbulencias planares
  - Criaturas psíquicas
  traits:
  - Sem gravidade
  - Tempo parado
  - Movimento por vontade
  - Conexao a todos os planos
  image: https://images.unsplash.com/photo-1708559831534-44c30eb3ab0e?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxmYW50YXN5JTIwY29zbWljJTIwbmVidWxhJTIwZXRoZXJlYWx8ZW58MXx8fHwxNzczMTU4Mzg0fDA&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral
  accentColor: var(--lf-info-blue)
- id: pl-06
  name: Plano Etereo
  alias: O Veu Nebuloso
  description: Uma dimensao sobreposta ao Material. Criaturas etereas podem ver o
    mundo real como formas nebulosas, mas nao podem ser vistas.
  longDescription: O Plano Etereo existe como uma camada sobreposta ao Plano Material
    e aos planos interiores. Quem entra no Etereo ve o mundo real como formas nebulosas
    e difusas — como olhar atraves de vidro embaciado. E possivel mover-se atraves
    de paredes e objectos solidos, mas nao interagir com eles. O Etereo Profundo e
    uma zona de nevoeiro denso onde se perdem viajantes — e onde residem criaturas
    como fantasmas, naga etereos e os temidos devourers. Em Lafiga, o Plano Etereo
    e o caminho preferido dos espiritos antes de chegarem ao Shadowfell.
  inhabitants:
  - Fantasmas
  - Naga etereos
  - Phase spiders
  - Criaturas em transicao
  dangers:
  - Desorientacao
  - Criaturas invisíveis
  - Etereo Profundo
  - Armadilhas planares
  traits:
  - Sobreposicao ao Material
  - Movimento atraves de solidos
  - Invisibilidade para mortais
  image: https://images.unsplash.com/photo-1708559831534-44c30eb3ab0e?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxmYW50YXN5JTIwY29zbWljJTIwbmVidWxhJTIwZXRoZXJlYWx8ZW58MXx8fHwxNzczMTU4Mzg0fDA&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral
  accentColor: var(--lf-arcane)
- id: pl-07
  name: Os Planos Exteriores
  alias: Os Reinos Divinos
  description: Dezasseis planos que representam os alinhamentos morais e eticos. Cada
    plano e governado por deuses ou entidades do alinhamento correspondente.
  longDescription: Os Planos Exteriores sao os reinos dos deuses e dos mortos. Organizam-se
    num anel (a Grande Roda) em torno do Outlands, com cada plano a representar um
    alinhamento. Mount Celestia (Leal Bom) e o lar dos anjos e dos deuses de justica;
    Baator (Leal Mau) sao os Nove Infernos dos diabos; o Abyss (Caotico Mau) e o dominio
    infinito dos demonios; Arborea (Caotico Bom) e a terra dos herois e das festas
    eternas. Em Lafiga, os deuses Lafigardianos residem no plano correspondente ao
    seu alinhamento, e as almas dos mortos viajam para o plano do deus que serviram
    em vida.
  inhabitants:
  - Deuses
  - Celestiais
  - Fiends
  - Modrons
  - Slaadi
  - Almas dos mortos
  dangers:
  - Deuses hostis
  - Exercitos de fiends
  - Corrupcao planar
  - Impossibilidade de regresso
  traits:
  - Moldado por alinhamento
  - Deuses residem fisicamente
  - Almas migram para ca
  image: https://images.unsplash.com/photo-1659834013683-dff8900c1845?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxzdGFycnklMjBuaWdodCUyMHNreSUyMG15dGhvbG9neXxlbnwxfHx8fDE3NzMxNTgzODl8MA&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral
  accentColor: var(--lf-gold)
entities:
- id: ent-01
  name: Aethon
  title: O Tecelao do Vazio
  alignment: Sem Alinhamento
  domain: Criacao / Vazio
  description: A entidade mais antiga conhecida. Existia antes dos planos, antes dos
    deuses, antes do conceito de "antes". Aethon e o vazio consciente que sonhou o
    multiverso.
  lore: Os estudiosos de Lafiga debatem se Aethon e uma entidade ou um fenomeno. Nao
    tem forma, nao tem vontade no sentido mortal — mas o multiverso existe porque
    Aethon "quis" que existisse. Alguns theologos acreditam que Aethon e o proprio
    tecido da realidade, e que se alguma vez "acordar", tudo deixara de existir. Os
    Asthrsherans foram os primeiros seres que Aethon criou conscientemente, para servirem
    de guardioes do que tinha sido sonhado.
  powers:
  - Criacao de realidade
  - Omnisciencia passiva
  - Imortalidade absoluta
  - Manipulacao do tempo
  tier: Primordial
- id: ent-02
  name: Khael'thar
  title: A Serpente Infinita
  alignment: Caotico Neutro
  domain: Caos / Transformacao
  description: Uma serpente cosmica cujo corpo circunda os Planos Exteriores.
  lore: Khael'thar e a personificacao do caos criativo. Enquanto Aethon sonhou a ordem
    do multiverso, Khael'thar sonhou as possibilidades — tudo o que poderia ter sido
    mas nao foi. A serpente e tao vasta que o seu corpo e confundido com as fronteiras
    entre planos.
  powers:
  - Distorcao planar
  - Geracao de possibilidades
  - Mutacao da realidade
  - Criacao de Slaadi
  tier: Primordial
- id: ent-03
  name: Solhara
  title: A Chama Eterna
  alignment: Neutro Bom
  domain: Luz / Vida / Renascimento
  description: Uma entidade de luz pura que reside no nucleo do Plano Positivo.
  lore: Solhara nao fala, nao ordena, nao julga — simplesmente irradia. A sua luz
    e a materia-prima da vida.
  powers:
  - Geracao de energia vital
  - Cura cosmica
  - Renascimento planar
  - Proteccao contra necromancia
  tier: Maior
- id: ent-04
  name: Nyxara
  title: A Sombra Que Observa
  alignment: Neutro Mau
  domain: Escuridao / Segredos / Entropia
  description: A contraparte de Solhara. Reside nos abismos mais profundos do Shadowfell.
  lore: Nyxara e a ausencia feita entidade. Onde Solhara irradia, Nyxara absorve.
  powers:
  - Absorcao de luz
  - Omnisciencia de segredos
  - Controlo de mortos-vivos
  - Manipulacao de sombras
  tier: Maior
- id: ent-05
  name: Os Asthrsherans
  title: Os Guardioes Primordiais
  alignment: Leal Neutro
  domain: Equilibrio / Ordem Cosmica
  description: Nao uma unica entidade, mas um colectivo de seres criados por Aethon
    para manter o equilibrio entre os planos.
  lore: Os Asthrsherans sao 7 seres de poder quase divino que existem desde o inicio
    da criacao.
  powers:
  - Manutencao planar
  - Restauracao de equilibrio
  - Poder quase divino
  - Imortalidade funcional
  tier: Primordial
- id: ent-06
  name: Vorthek
  title: O Devorador de Estrelas
  alignment: Caotico Mau
  domain: Destruicao / Fome Cosmica
  description: Uma entidade parasita que se alimenta de planos inteiros.
  lore: Vorthek e o pesadelo dos cosmologos. Vem de fora — do Far Realm.
  powers:
  - Consumo de realidade
  - Loucura induzida
  - Corrupcao dimensional
  - Regeneracao infinita
  tier: Primordial
- id: ent-07
  name: Illyreth
  title: A Tecela do Destino
  alignment: Leal Neutro
  domain: Destino / Profecia / Fios do Tempo
  description: Uma entidade que ve todos os futuros possiveis simultaneamente.
  lore: Illyreth nao interfere — observa e tece.
  powers:
  - Visao de todos os futuros
  - Tecedura do destino
  - Profecia verdadeira
  - Imunidade temporal
  tier: Maior
gods:
- id: god-01
  name: Solarius
  title: O Senhor da Aurora
  alignment: Leal Bom
  domains:
  - Luz
  - Vida
  symbol: Sol dourado com 12 raios
  iconKey: Sun
  description: Deus do sol, da justica e da verdade. Patrono dos paladinos e dos que
    combatem a escuridao.
  lore: Solarius foi o primeiro deus a manifestar-se no Plano Material de Lafiga,
    trazendo a luz que separou o dia da noite. E representado como um guerreiro radiante
    com armadura dourada. Os seus templos sao sempre orientados a nascente, e os seus
    clerigos levantam-se antes do amanhecer para rezar.
  clericNote: Clerigos de Solarius usam dominios de Luz ou Vida. Ganham proficiencia
    em armadura pesada e resistencia a dano radiante no nivel 6.
  accentColor: var(--lf-gold)
- id: god-02
