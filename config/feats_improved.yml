# Feats com regras especiais melhoradas para o sistema
feats:
  adepto_elemental:
    key_aliases: ["elemental_adept"]
    name: "Adepto Elemental"
    description: "<p>Quando você ganha esse talento, escolha um dos tipos de dano a seguir: ácido, elétrico, fogo, frio ou trovão.</p><p>As magias que você conjurará ignoram resistência a dano do tipo escolhido. Além disso, quando você rola o dano para uma magia que você conjurará que causar dano desse tipo, você pode tratar qualquer 1 num dado de dano como um 2.</p><p>Você pode escolher esse talento diversas vezes. A cada vez que o fizer, você deve escolher um tipo diferente de dano.</p>"
    prerequisites:
      spellcasting: true
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      magic_modifiers:
        elemental_focus:
          implementation: "elemental_adept"
          parameters: { damage_type_choice: ["ácido","elétrico","fogo","frio","trovão"], ones_count_as: 2 }
    features:
      name: "Canalização Elemental"
      desc: "Escolha ácido, elétrico, fogo, frio ou trovão; suas magias ignoram resistência a esse tipo e 1s nos dados viram 2."

  adepto_marcial:
    key_aliases: ["martial_adept"]
    name: "Adepto Marcial"
    description: "<p>Você tem treinamento marcial que permite a você realizar manobras de combate especiais. Você ganha os seguintes benefícios:</p><ul><li><p>Você aprende duas manobras, à sua escolha, das que estão disponíveis ao arquétipo Mestre de Batalha na classe guerreiro. Se a manobra que você usar obrigará um alvo a realizar um teste de resistência, a CD do teste de resistência será igual a 8 + seu bônus de proficiência + seu modificador de Força ou Destreza (à sua escolha).</p></li><li><p>Se você já tiver dados de superioridade, você ganha um adicional; do contrário, você terá um dado de superioridade, que é um d6. Esse dado é usado para abastecer suas manobras. Um dado de superioridade é gasto quando você o usa. Você recupera seus dados de superioridade gastos quando termina um descanso curto ou longo.</p></li></ul>"
    prerequisites: {}
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      maneuvers:
        choose: 2
        options:
          - { id: "aparar", name: "Aparar" }
          - { id: "ameacador", name: "Ataque Ameaçador" }
          - { id: "encontrao", name: "Ataque de Encontrão" }
          - { id: "desarmar", name: "Ataque Desarmante" }
          - { id: "trespassante", name: "Ataque Trespassante" }
          - { id: "provocante", name: "Ataque Provocante" }
          - { id: "derrubar", name: "Derrubar" }
          - { id: "distrativo", name: "Golpe Distrativo" }
          - { id: "ripostar", name: "Contra-Atacar" }
          - { id: "preciso", name: "Ataque Preciso" }
      superiority_die:
        implementation: "grant_superiority_die"
        parameters: { count: 1, die: "d6" }
    features:
      name: "Técnicas de Combate"
      desc: "Aprende 2 manobras (Mestre de Batalha) e ganha 1 dado de superioridade (d6)."

  atleta:
    key_aliases: ["athlete"]
    name: "Atleta"
    description: "<p>Você passou por extenso treinamento físico para ganhar os seguintes benefícios:</p><ul><li><p>Aumente seu valor de Força ou Destreza em 1, até o máximo de 20.</p></li><li><p>Quando você estiver caído, se levantar requer apenas 1,5 metro do seu deslocamento.</p></li><li><p>Escalar não custa movimento adicional a você.</p></li><li><p>Você pode realizar um salto em distância correndo ou um salto em altura correndo se movendo apenas um passo de ajuste de 1,5 metro, ao invés de 3 metros.</p></li></ul>"
    prerequisites: {}
    ability_bonuses:
      choose: { amount: 1, options: ["str","dex"] }
    proficiency_bonuses: {}
    special_rules:
      movement_modifiers:
        stand_up_cost_reduced:
          implementation: "stand_up_cost"
          parameters: { cost_ft: 5 }
        climb_no_extra_movement:
          implementation: "climb_no_extra_cost"
          parameters: {}
        jump_with_5ft_run:
          implementation: "reduced_run_up_for_jump"
          parameters: { distance_ft: 5 }
    features:
      name: "Condicionamento"
      desc: "+1 FOR/DEX; levantar custa 1,5m; escalar não custa extra; salto com corrida usando apenas 1,5m."

  ator:
    key_aliases: ["actor"]
    name: "Ator"
    description: "<p>Perito em mímica e dramaturgia, você recebe os seguintes benefícios:</p><ul><li><p>Aumente seu valor de Carisma em 1, até o máximo de 20.</p></li><li><p>Você tem vantagem em testes de Carisma (Atuação) e Carisma (Enganação) quando você estiver tentando se passar por uma pessoa diferente.</p></li><li><p>Você pode imitar a articulação de outra pessoa ou os sons feitos por outras criaturas. Você deve ter ouvido a pessoa falando ou ouvido a criatura fazendo o som por, pelo menos, 1 minuto. Um sucesso num teste de Sabedoria (Intuição) resistido pelo seu teste de Carisma (Enganação) permite que um ouvinte determine que o efeito é falso.</p></li></ul>"
    prerequisites: {}
    ability_bonuses: { cha: 1 }
    proficiency_bonuses: {}
    special_rules:
      skill_modifiers:
        skill_advantage:
          implementation: "skill_advantage"
          parameters: ["Atuação","Enganação"]
      social_modifiers:
        mimicry:
          implementation: "voice_mimicry"
          parameters: { requires_listen_min: 1 }
    features:
      name: "Performance Versátil"
      desc: "+1 CAR; vantagem em Atuação/Enganação ao personificar; pode imitar vozes/sons após 1 min ouvindo."

  especialista_em_briga:
    key_aliases: ["tavern_brawler"]
    name: "Especialista em Briga"
    description: "<p>Acostumado a brigas de bar usando qualquer coisa como armas, e na falta, os punhos, você ganha os seguintes benefícios:</p><ul><li><p>Aumente o valor de Força ou Constituição em 1, até o máximo de 20.</p></li><li><p>Seus ataques desarmados causam 1d4 de dano.</p></li><li><p>Quando você atinge uma criatura com um ataque desarmado ou com uma arma improvisada, no seu turno, você pode usar uma ação bônus para tentar agarrar o alvo.</p></li></ul>"
    prerequisites: {}
    ability_bonuses:
      choose: { amount: 1, options: ["str","con"] }
    proficiency_bonuses: {}
    special_rules:
      unarmed_modifiers:
        unarmed_damage_die:
          implementation: "unarmed_damage_die"
          parameters: { die: "d4" }
      combat_modifiers:
        bonus_action_grapple_on_hit:
          implementation: "bonus_action_grapple_on_hit"
          parameters: {}
    features:
      name: "Briga de Taverna"
      desc: "+1 FOR/CON; dano desarmado 1d4; após atingir com desarmado/arma improvisada, pode agarrar (ação bônus)."

  investida_poderosa:
    key_aliases: ["charger"]
    name: "Investida Poderosa"
    description: "<p>Quando você usa a ação de Disparada, você pode usar sua ação bônus para realizar um ataque corpo-a-corpo com arma ou para empurrar uma criatura.</p><p>Se você se mover, pelo menos, 3 metros em linha reta, imediatamente antes de realizar essa ação bônus, você pode tanto ganhar +5 de bônus na jogada de dano do ataque (se você escolher realizar um ataque corpo-a-corpo e atingir) ou empurrar o alvo até 3 metros de você (se você escolher empurrar e for bem sucedido).</p>"
    prerequisites: {}
    special_rules:
      combat_modifiers:
        bonus_action_shove:
          implementation: "bonus_action_attack_or_shove_after_dash"
          parameters: { min_move_ft: 10, damage_bonus: 5 }
    features:
      name: "Impulso Ofensivo"
      desc: "Após Disparada, ação bônus: ataque CC/empurrão; se mover 3m em linha reta antes, +5 no dano do ataque."

  maestria_em_armadura_media:
    key_aliases: ["medium_armor_master"]
    name: "Maestria em Armadura Média"
    description: "<p>Você praticou seus movimentos usando armaduras pesadas para ganhar os seguintes benefícios:</p><ul><li><p>Vestir uma armadura média não lhe impõe desvantagem em testes de Destreza (Furtividade).</p></li><li><p>Quando você estiver vestindo uma armadura média, você pode adicionar 3, ao invés de 2, à sua CA, se você tiver Destreza 16 ou maior.</p></li></ul>"
    prerequisites:
      proficiencies: { armors: ["média"] }
    special_rules:
      stealth_conditions:
        implementation: "stealth_conditions"
        parameters: { no_disadvantage_in_medium_armor: true }
      defense_modifiers:
        dex_cap_plus_three:
          implementation: "medium_armor_dex_cap"
          parameters: { dex_cap: 3, requires_dex: 16 }
    features:
      name: "Ajuste Preciso"
      desc: "Sem desvantagem de Furtividade em armadura média; com DES 16+, adiciona +3 à CA (em vez de +2)."

  maestria_em_armadura_pesada:
    key_aliases: ["heavy_armor_master"]
    name: "Maestria em Armadura Pesada"
    description: "<p>Você pode usar sua armadura para defletir ataques potencialmente fatais a outros. Você ganha os seguintes benefícios:</p><ul><li><p>Aumente seu valor de Força em 1, até o máximo de 20.</p></li><li><p>Quando você estiver vestindo uma armadura pesada, dano de concussão, cortante e perfurante que você recebe de ataques não-mágicos será reduzido em 3.</p></li></ul>"
    prerequisites:
      proficiencies: { armors: ["pesada"] }
    ability_bonuses: { str: 1 }
    special_rules:
      defense_modifiers:
        damage_resistance:
          implementation: "reduce_nonmagical_bps_damage"
          parameters: { reduce: 3 }
    features:
      name: "Peso que Protege"
      desc: "+1 FOR; em armadura pesada, reduz em 3 dano de contusão/corte/perfuração de ataques não-mágicos."

  matador_de_conjuradores:
    key_aliases: ["mage_slayer"]
    name: "Matador de Conjuradores"
    description: "<p>Você praticou técnicas úteis em combate corpo-a-corpo contra conjuradores, ganhando os seguintes benefícios:</p><ul><li><p>Quando uma criatura a até 1,5 metro de você conjurar uma magia, você pode usar sua reação para realizar um ataque corpo-a-corpo contra ela.</p></li><li><p>Quando você causa dano em uma criatura que está se concentrando em uma magia, a criatura terá desvantagem no teste de resistência que ela fizer para manter a concentração.</p></li><li><p>Você tem vantagem em testes de resistência contra magias conjuradas por criaturas a até 1,5 metro de você.</p></li></ul>"
    prerequisites: {}
    special_rules:
      combat_modifiers:
        reaction_attack_on_cast:
          implementation: "reaction_melee_attack_when_adjacent_casts"
          parameters: { range_m: 1.5 }
        impose_concentration_disadvantage:
          implementation: "disadvantage_on_concentration_when_hit"
          parameters: {}
        advantage_on_saves_vs_adjacent_spells:
          implementation: "advantage_on_saves_vs_adjacent_caster"
          parameters: { range_m: 1.5 }
    features:
      name: "Antimagia Agressiva"
      desc: "Reação: ataque CC quando alvo adjacente conjura; alvos atingidos têm desvantagem para manter concentração; vantagem em testes contra magias conjuradas adjacentes."

  resistente:
    key_aliases: ["durable","duravel"]
    name: "Resistente"
    description: "<p>Duro e resistente, você ganha os seguintes benefícios:</p><ul><li><p>Aumente seu valor de Constituição em 1, até o máximo de 20.</p></li><li><p>Quando você rolar um Dado de Vida para recuperar pontos de vida, o valor mínimo de pontos de vida que você recupera dessa rolagem será igual a duas vezes seu modificador de Constituição (mínimo de 2).</p></li></ul>"
    prerequisites: {}
    ability_bonuses: { con: 1 }
    special_rules:
      dice_modifiers:
        hit_points_bonus:
          implementation: "hit_points_per_level"
          parameters: { bonus_per_level: 0, retroactive: false }
      hit_dice_minimum_heal:
        implementation: "hit_die_minimum_heal"
        parameters: { minimum: "2x_con_mod", minimum_floor: 2 }
    features:
      name: "Recuperação Constante"
      desc: "+1 CON; ao rolar Dado de Vida para curar, cura no mínimo 2×mod.CON (mínimo 2)."
  mobilidade:
    name: "Mobilidade"
    description: "<p>Você é excepcionalmente rápido e ágil. Você ganha os seguintes benefícios:</p><ul><li><p>Seu deslocamento aumenta em 3 metros.</p></li><li><p>Quando você usa a ação de Disparada, mover-se através de terreno difícil não lhe custa qualquer movimento adicional neste turno.</p></li><li><p>Quando você realiza um ataque corpo-a-corpo contra uma criatura, você não provoca ataques de oportunidade para essa criatura pelo resto do turno, independentemente de ter atingido ou não.</p></li></ul>"
    prerequisites: {}
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      movement_modifiers:
        speed_bonus:
          implementation: "add_to_speed"
          parameters: { bonus: 3, unit: "metros" }
        difficult_terrain_immunity:
          implementation: "ignore_difficult_terrain"
          parameters: { condition: "disparada" }
      combat_modifiers:
        opportunity_attack_immunity:
          implementation: "no_oa_after_attack"
          parameters: { condition: "após_atacar_criatura" }
    features:
      name: "Agilidade de Combate"
      desc: "Deslocamento +3 m; terreno difícil é ignorado quando usa Disparada; após atacar uma criatura, ela não tem OA contra você neste turno."

  atirador_eximio:
    key_aliases: ["sharpshooter","atirador_agucado"]
    name: "Atirador Aguçado"
    description: "<p>Você dominou o uso de armas à distância e pode realizar tiros que seriam impossíveis para outros. Você ganha os seguintes benefícios:</p><ul><li><p>Atacar um alvo além da distância normal não impõem desvantagem nas suas jogadas de ataque com armas à distância.</p></li><li><p>Seus ataques com armas à distância ignoram meia-cobertura e três-quartos de cobertura.</p></li><li><p>Antes de realizar um ataque com uma arma à distância na qual você seja proficiente, você pode escolher sofrer –5 de penalidade na jogada de ataque. Se o ataque atingir, você adiciona +10 no dano do ataque.</p></li></ul>"
    prerequisites: {}
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      combat_modifiers:
        cover_immunity:
          implementation: "ignore_cover_types"
          parameters: ["leve", "média"]
        range_advantage:
          implementation: "no_long_range_disadvantage"
          parameters: { weapon_type: "ranged" }
        power_attack:
          implementation: "power_attack_option"
          parameters: { attack_penalty: -5, damage_bonus: 10, weapon_type: "ranged" }
    features:
      name: "Precisão Letal"
      desc: "Ignora coberturas leve/média; não sofre desvantagem em alcance longo; opção de −5 no ataque para +10 no dano."

  sniper_magico:
    key_aliases: ["spell_sniper"]
    name: "Atirador de Magia"
    description: "<p>Você aprende técnicas para aprimorar seus ataques com certos tipos de magia, ganhando os seguintes benefícios:</p><ul><li><p>Quando você conjura uma magia que requer que você realize uma jogada de ataque, o alcance da magia é dobrada.</p></li><li><p>Seus ataques à distância com magia ignoram meia-cobertura ou três-quartos de cobertura.</p></li><li><p>Você aprende um truque que requer uma jogada de ataque. Escolha o truque da lista de magias do bardo, bruxo, clérigo, druida, feiticeiro ou mago. Sua habilidade de conjuração para esse truque depende da lista de magia a qual você escolheu o truque: Carisma para bardo, bruxo ou feiticeiro; Sabedoria para clérigo ou druida; ou Inteligência para mago.</p></li></ul>"
    prerequisites:
      spellcasting: true
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      combat_modifiers:
        cover_immunity:
          implementation: "ignore_cover_types"
          parameters: ["leve", "média"]
        spell_range_double:
          implementation: "double_spell_range"
          parameters: { spell_type: "ataque_à_distância" }
      magic_modifiers:
        learn_cantrip:
          implementation: "learn_cantrip"
          parameters: { type: "ataque_à_distância", class_choice: true }
    features:
      name: "Magias de Precisão"
      description: "Dobra o alcance de magias de ataque à distância; ignora cobertura leve/média; aprende 1 truque de ataque à distância."

  mestre_de_armas_grandes:
    key_aliases: ["great_weapon_master"]
    name: "Mestre de Armas Grandes"
    description: "<p>Você aprendeu a usar o peso em sua vantagem, deixando o balanço potencializar seus golpes. Você recebe os seguintes benefícios:</p><ul><li><p>No seu turno, quando você atingir um acerto crítico com uma arma corpo-a-corpo ou reduzir os pontos de vida de uma criatura a 0, você pode realizar um ataque corpo-a-corpo com arma, com uma ação bônus.</p></li><li><p>Antes de você realizar um ataque corpo-a-corpo com uma arma pesada na qual você seja proficiente, você pode escolher sofrer –5 de penalidade em sua jogada de ataque. Se o ataque atingir, você adiciona +10 ao dano do ataque.</p></li></ul>"
    prerequisites: {}
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      combat_modifiers:
        bonus_action_attack:
          implementation: "bonus_action_attack_on_crit_or_kill"
          parameters: { trigger: ["crítico", "reduzir_a_0_pv"], attack_type: "corpo_a_corpo" }
        power_attack:
          implementation: "power_attack_option"
          parameters: { attack_penalty: -5, damage_bonus: 10, weapon_type: "pesada" }
    features:
      name: "Ataques Poderosos"
      desc: "Ataque extra (ação bônus) ao critar/abater; opção de golpe poderoso com armas pesadas."

  mestre_de_armas_duplas:
    key_aliases: ["dual_wielder"]
    name: "Ambidestro"
    description: "<p>Você dominou o estilo de luta com duas armas, ganhando os seguintes benefícios:</p><ul><li><p>Você ganha +1 de bônus na CA enquanto estiver empunhando uma arma corpo-a-corpo em cada mão.</p></li><li><p>Você pode usar combater com duas armas mesmo que a arma de uma mão que você está empunhando não seja leve.</p></li><li><p>Você pode sacar ou guardar duas armas de uma mão quando você, normalmente, seria capaz de sacar ou guardar apenas uma.</p></li></ul>"
    prerequisites: {}
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      equipment_modifiers:
        armor_class_bonus:
          implementation: "equipment_ac_bonus"
          parameters: { condition: "duas_armas", bonus: 1 }
        weapon_restriction_removal:
          implementation: "remove_weapon_restriction"
          parameters: "armas_duplas_não_leves"
        dual_wield_draw:
          implementation: "dual_wield_draw"
          parameters: { action: "sacar_ou_guardar", weapons: 2 }
    features:
      name: "Combate Duplo"
      desc: "+1 CA com duas armas; pode usar armas de uma mão não-leves; sacar/guardar duas armas de uma vez."

  sortudo:
    key_aliases: ["lucky"]
    name: "Sortudo"
    description: "Você tem uma sorte inexplicável que parece surgir nos momentos exatos. Você tem 3 pontos de sorte. A qualquer momento que você realizar uma jogada de ataque, teste de habilidade ou teste de resistência, você pode gastar um ponto de sorte para rolar um d20 adicional. Você pode escolher gastar um dos seus pontos de sorte depois de rolar o dado, mas antes de saber o resultado da jogada. Você escolhe qual dos d20s irá usar para a jogada de ataque, teste de habilidade ou teste de resistência. Você também pode gastar um ponto de sorte quando uma jogada de ataque for feita contra você. Role um d20, e então escolha se o ataque irá usar a jogada do atacante ou a sua. Se mais de uma criatura gastar um ponto de sorte para influenciar uma mesma jogada, os pontos se cancelam mutuamente; nenhum dado adicional é rolado. Você recupera seus pontos de sorte gastos após terminar um descanso longo."
    prerequisites: {}
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      dice_modifiers:
        luck_points:
          implementation: "luck_points"
          parameters: { points: 3, recovery: "descanso_longo", uses: ["ataque", "teste", "salvaguarda", "forçar_rerrolar_inimigo"] }
    features:
      name: "Pontos de Sorte"
      desc: "3 pontos de sorte para rerrolar d20 (seu ou do inimigo contra você); recupera após descanso longo."

  robusto:
    key_aliases: ["tough"]
    name: "Robusto"
    description: "Seu máximo de pontos de vida aumenta em um valor igual a duas vezes seu nível quando você adquire esse talento. Toda vez que você ganhar um nível, após isso, seu máximo de pontos de vida aumenta em 2 pontos de vida adicionais."
    prerequisites: {}
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      dice_modifiers:
        hit_points_bonus:
          implementation: "hit_points_per_level"
          parameters: { bonus_per_level: 2, retroactive: true }
    features:
      name: "PV Aumentados"
      desc: "+2 PV por nível (retroativo ao adquirir)."

  conjurador_de_batalha:
    key_aliases: ["war_caster"]
    name: "Conjurador de Guerra"
    description: "<p>Você praticou a conjuração de magias no meio do combate, aprendendo técnicas que lhe concedem os seguintes benefícios:</p><ul><li><p>Você tem vantagem em testes de resistência de Constituição para manter sua concentração em uma magia quando você sofrer dano.</p></li><li><p>Você pode realizar os componentes somáticos de uma magia mesmo quando está com armas ou um escudo em uma ou ambas as mãos.</p></li><li><p>Quando o movimento de uma criatura hostil provocar um ataque de oportunidade para você, você pode usar sua reação para conjurar uma magia na criatura, ao invés de realizar o ataque de oportunidade. A magia deve ter um tempo de conjuração de 1 ação e deve ter apenas uma criatura como alvo.</p></li></ul>"
    prerequisites:
      spellcasting: true
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      magic_modifiers:
        somatic_components_with_hands_full:
          implementation: "somatic_with_hands_full"
          parameters: { equipment: ["armas", "escudo"] }
        spell_as_opportunity_attack:
          implementation: "spell_as_oa"
          parameters: { spell_action: "1 ação", target_restriction: "único alvo" }
    features:
      name: "Concentração e Gestos"
      desc: "Pode S com mãos ocupadas; ao invés de OA, conjura magia de 1 ação de alvo único."

  especialista_em_besta:
    key_aliases: ["crossbow_expert"]
    name: "Especialista em Besta"
    description: "<p>Graças a sua pratica extensiva com bestas, você ganha os seguintes benefícios:</p><ul><li><p>Você ignora a qualidade de recarga de bestas nas quais você é proficiente.</p></li><li><p>Estar a 1,5 metro de uma criatura hostil não impõem desvantagem nas suas jogadas de ataque à distância.</p></li><li><p>Quando você usa a ação de Ataque e ataca com uma arma de uma mão, você pode usar sua ação bônus para atacar com uma besta de mão carregada que você esteja empunhando.</p></li></ul>"
    prerequisites: {}
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      equipment_modifiers:
        weapon_property_ignore:
          implementation: "ignore_weapon_property"
          parameters: { property: "recarga", weapon_type: "bestas" }
      combat_modifiers:
        range_advantage:
          implementation: "no_close_range_disadvantage"
          parameters: { weapon_type: "ranged", condition: "1,5m_de_criatura_hostil" }
        bonus_action_attack:
          implementation: "bonus_action_attack"
          parameters: { weapon: "besta_de_mão", condition: "após_ataque_com_arma_de_uma_mão" }
    features:
      name: "Domínio de Bestas"
      desc: "Ignora recarga das bestas; sem desvantagem a 1,5 m; ação bônus com besta de mão após atacar com arma de 1 mão."

  observador:
    key_aliases: ["observant"]
    name: "Observador"
    description: "<p>Rápido em perceber os detalhes do ambiente, você ganha os seguintes benefícios:</p><ul><li><p>Aumente seu valor de Inteligência ou Sabedoria em 1, até o máximo de 20.</p></li><li><p>Se você puder ver a boca de uma criatura enquanto ela fala um idioma que você compreende, você pode interpretar o que ela está dizendo ao ler os seus lábios. Você tem +5 de bônus nos seus valores passivos de Sabedoria (Percepção) e Inteligência (Investigação).</p></li></ul>"
    prerequisites:
      ability_score: { wis: 13 }
    ability_bonuses: { wis: 1, int: 1 }
    proficiency_bonuses:
      skills: ["Percepção"]
    special_rules:
      skill_modifiers:
        skill_advantage:
          implementation: "skill_advantage"
          parameters: ["Investigação", "Percepção"]
        lip_reading:
          implementation: "lip_reading"
          parameters: { condition: "compreender_idioma", range: "visão" }
    features:
      name: "Leitura Labial e Percepção Afiada"
      desc: "Vantagem em Investigação/Percepção; lê lábios se entender o idioma."

  mestre_do_escudo:
    key_aliases: ["shield_master"]
    name: "Mestre de Escudo"
    description: "<p>Você não usa escudos apenas para proteção, mas também de forma ofensiva. Você ganha os seguintes benefícios enquanto estiver empunhando um escudo:</p><ul><li><p>Se você realizar a ação de Ataque no seu turno, você pode usar uma ação bônus para tentar empurrar uma criatura, a até 1,5 metro de você, com seu escudo.</p></li><li><p>Se você não estiver incapacitado, você pode adicionar seu bônus de CA do escudo a qualquer teste de resistência de Destreza que você fizer contra uma magia ou outro efeito nocivo que tenha você como alvo.</p></li><li><p>Se você for alvo de um efeito que permita realizar um teste de resistência de Destreza para sofrer apenas metade do dano, você pode usar sua reação para não sofrer dano se passar no teste de resistência, interpondo seu escudo entre você e a fonte do efeito.</p></li></ul>"
    prerequisites: {}
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      combat_modifiers:
        bonus_action_shove:
          implementation: "bonus_action_shove"
          parameters: { trigger: "após_ataque", requires: "escudo" }
        shield_bonus_to_dex_save:
          implementation: "shield_bonus_to_dex_save"
          parameters: { self_only: true }
        shield_master_reaction:
          implementation: "shield_master_reaction"
          parameters: { reaction: true, requires: "escudo" }
    features:
      name: "Controle Defensivo"
      desc: "Empurrão (ação bônus) ao atacar; adiciona escudo a testes de DES que afetem só você; reduz a 0 com reação em DES por metade."

  duelista_defensivo:
    key_aliases: ["defensive_duelist"]
    name: "Duelista Defensivo"
    description: "Quando você estiver empunhando uma arma de acuidade com a qual você seja proficiente e outra criatura atingir você com um ataque corpo-a-corpo, você pode usar sua reação para adicionar seu bônus de proficiência a sua CA para esse ataque, potencialmente fazendo o ataque errar."
    prerequisites:
      ability_score: { dex: 13 }
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      defense_modifiers:
        reaction_ac_bonus:
          implementation: "reaction_ac_bonus"
          parameters: "proficiency_bonus"
    features:
      name: "Reação Defensiva"
      desc: "Com arma de finesse, usa reação para adicionar proficiência à CA contra um ataque corpo a corpo."

  mestre_arma_de_haste:
    key_aliases: ["polearm_master"]
    name: "Maestria em Arma de Haste"
    description: "<p>Você consegue manter seus inimigos afastados utilizando armas de haste. Você ganha os seguintes benefícios:</p><ul><li><p>Quando você realiza a ação de Ataque e ataca com uma glaive, alabarda ou bordão, você pode usar uma ação bônus para realizar um ataque corpo-a-corpo com a outra extremidade da arma. Esse ataque usa o mesmo modificador de habilidade do ataque primário. O dado de dano da arma para esse ataque é um d4 e o ataque causa dano de concussão.</p></li><li><p>Enquanto você estiver empunhando uma glaive, alabarda, lança longa ou bastão, as outras criaturas provocam um ataque de oportunidade a você quando entrarem no seu alcance.</p></li></ul>"
    prerequisites: {}
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      combat_modifiers:
        bonus_action_attack:
          implementation: "bonus_action_attack"
          parameters: { damage: "1d4", damage_type: "concussão", weapon: "extremidade" }
        opportunity_attack_enhancement:
          implementation: "oa_on_enter_reach"
          parameters: { weapon_list: ["glaive", "alabarda", "lança_longa", "bordão"] }
    features:
      name: "Controle de Alcance"
      desc: "Ataque extra (ação bônus) com extremidade; OA dispara quando entram no seu alcance."

  sentinela:
    key_aliases: ["sentinel"]
    name: "Sentinela"
    description: "<p>Você domina técnicas para obter vantagem a cada vez que qualquer inimigo baixar a guarda, ganhando os seguintes benefícios:</p><ul><li><p>Quando você atinge uma criatura com um ataque de oportunidade, o deslocamento da criatura se torna 0 pelo resto do turno.</p></li><li><p>As criaturas provocam ataques de oportunidade de você mesmo se realizarem a ação de Desengajar antes de saírem do seu alcance.</p></li><li><p>Quando uma criatura a até 1,5 metro de você realizar um ataque contra um alvo diferente de você (e o alvo não possuir esse talento), você pode usar sua reação para realizar um ataque corpo-a-corpo com arma contra a criatura atacante.</p></li></ul>"
    prerequisites: {}
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      combat_modifiers:
        opportunity_attack_enhancement:
          implementation: "oa_reduce_movement_to_zero"
          parameters: {}
        provoke_oa_ignores_disengage:
          implementation: "oa_even_if_disengage"
          parameters: {}
        protect_ally_reaction:
          implementation: "melee_reaction_against_attacker"
          parameters: { range_m: 1.5 }
    features:
      name: "Trava de Alcance"
      desc: "OA zera deslocamento; inimigos ainda provocam OA após Desengajar; reação contra inimigo adjacente que atacar outro."

  perito:
    key_aliases: ["skilled"]
    name: "Perito"
    description: "Você ganha proficiência em qualquer combinação de três perícias ou ferramentas, à sua escolha."
    prerequisites: {}
    ability_bonuses: {}
    proficiency_bonuses:
      skills_or_tools:
        choose: { amount: 3, options: ["qualquer perícia ou ferramenta"] }
    special_rules: {}
    features:
      name: "Treinamento Amplo"
      desc: "Proficiência em três perícias e/ou ferramentas à escolha."

  poliglota:
    key_aliases: ["linguist"]
    name: "Poliglota"
    description: "<p>Você estudou línguas e códigos, ganhando os seguintes benefícios:</p><ul><li><p>Aumente seu valor de Inteligência em 1, até o máximo de 20.</p></li><li><p>Você aprende três idiomas, à sua escolha.</p></li><li><p>Você é capaz de criar criptogramas escritos. Outros não podem decifrar um código criado por você a não ser que você os ensine, elas sejam bem sucedidas num teste de inteligência (CD igual ao seu valor de Inteligência + seu bônus de proficiência) ou usem mágica para decifrá-lo.</p></li></ul>"
    prerequisites: {}
    ability_bonuses: { int: 1 }
    proficiency_bonuses: { languages_choose: 3 }
    special_rules:
      utility_modifiers:
        create_cipher:
          implementation: "create_cipher"
          parameters: { decipher_dc: "int_mod + proficiency_bonus", alt: ["instructor_help", "magic"] }
    features:
      name: "Criptografia"
      desc: "Cria cifra escrita; outros decifram com instrução, teste de INT (CD INT+prof) ou magia."

  protecao_leve:
    key_aliases: ["lightly_armored"]
    name: "Proteção Leve"
    description: "<p>Você treinou até dominar o uso de armaduras leves, ganhando os seguintes benefícios:</p><ul><li><p>Aumente seu valor de Força em 1, até o máximo de 20.</p></li><li><p>Você ganha proficiência com armadura leves.</p></li></ul>"
    prerequisites: {}
    ability_bonuses: { str: 1 }
    proficiency_bonuses: { armors: ["leve"] }
    special_rules: {}
    features:
      name: "Armadura Leve"
      desc: "Ganha proficiência com armaduras leves e +1 FOR."

  protecao_moderada:
    key_aliases: ["moderately_armored"]
    name: "Proteção Moderada"
    description: "<p>Você treinou até dominar o uso de armaduras médias e escudos, ganhando os seguintes benefícios:</p><ul><li><p>Aumente seu valor de Força em 1, até o máximo de 20.</p></li><li><p>Você ganha proficiência com armadura média e escudos.</p></li></ul>"
    prerequisites:
      proficiencies: { armors: ["leve"] }
    ability_bonuses: { str: 1 }
    proficiency_bonuses: { armors: ["média"], shields: true }
    special_rules: {}
    features:
      name: "Armadura Média + Escudo"
      desc: "Proficiência com armaduras médias e escudos e +1 FOR."

  protecao_pesada:
    key_aliases: ["heavily_armored","especialista_em_armadura"]
    name: "Proteção Pesada"
    description: "<p>Você treinou até dominar o uso de armaduras pesadas, ganhando os seguintes benefícios:</p><ul><li><p>Aumente seu valor de Força em 1, até o máximo de 20.</p></li><li><p>Você ganha proficiência com armadura pesada.</p></li></ul>"
    prerequisites:
      proficiencies: { armors: ["média"] }
    ability_bonuses: { str: 1 }
    proficiency_bonuses: { armors: ["pesada"] }
    special_rules: {}
    features:
      name: "Armadura Pesada"
      desc: "Proficiência com armaduras pesadas e +1 FOR."

  duelista_montado:
    key_aliases: ["mounted_combatant"]
    name: "Combatente Montado"
    description: "<p>Você é um oponente perigoso de se enfrentar quando está montado. Enquanto estiver montado e não estiver incapacitado, você ganha os seguintes benefícios:</p><ul><li><p>Você tem vantagem nas jogadas de ataque corpo-a-corpo contra qualquer criatura desmontada que seja menor que a sua montaria.</p></li><li><p>Você pode forçar que um ataque direcionado a sua montaria seja direcionado a você, em seu lugar.</p></li><li><p>Se sua montaria for alvo de um efeito que permita a ela realizar um teste de resistência de Destreza para reduzir o dano à metade, ao invés disso, ela não sofre qualquer dano se for bem sucedida no teste de resistência, e apenas metade se falhar.</p></li></ul>"
    prerequisites: {}
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      combat_modifiers:
        advantage_vs_smaller:
          implementation: "advantage_melee_vs_smaller_than_mount"
          parameters: {}
        redirect_attack_to_self:
          implementation: "redirect_attack_from_mount"
          parameters: { once_per_turn: true }
        mount_evasion_like:
          implementation: "dex_save_half_to_zero_for_mount"
          parameters: { on_success: "no_damage" }
    features:
      name: "Controle de Montaria"
      desc: "Vantagem vs. criaturas menores que a montaria; pode fazer ataques contra a montaria mirarem em você; DES/½ vira 0 p/ montaria se passar."

  atacante_selvagem:
    key_aliases: ["savage_attacker"]
    name: "Atacante Bestial"
    description: "Uma vez por turno, quando você rolar o dano para um ataque corpo-a-corpo com arma, você pode jogar novamente o dado de dano da arma e usar qualquer dos valores."
    prerequisites: {}
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      dice_modifiers:
        damage_reroll:
          implementation: "damage_reroll"
          parameters: { frequency: "once_per_turn", attack_type: "melee" }
    features:
      name: "Dano Brutal"
      desc: "Uma vez por turno, pode rerrolar dados de dano de ataque corpo a corpo e escolher o resultado."

  sorrateiro:
    key_aliases: ["skulker"]
    name: "Sorrateiro"
    description: "<p>Você é especialista em espreitar através das sombras. Você ganha os seguintes benefícios:</p><ul><li><p>Você pode tentar se esconder quando estiver levemente obscurecido para a criatura de quem você está tentando se esconder.</p></li><li><p>Quando você estiver escondido de uma criatura e errar um ataque à distância contra ela, realizar esse ataque não revelará sua posição.</p></li><li><p>Penumbra não impõem desvantagem nos seus testes de Sabedoria (Percepção) relacionados a visão.</p></li></ul>"
    prerequisites:
      ability_score: { dex: 13 }
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      movement_modifiers:
        stealth_conditions:
          implementation: "stealth_in_light_obscurement"
          parameters: {}
      combat_modifiers:
        missed_ranged_attack_does_not_reveal:
          implementation: "stay_hidden_on_missed_ranged_attack"
          parameters: {}
      skill_modifiers:
        dim_light_no_disadvantage_on_perception:
          implementation: "remove_dim_light_perception_disadvantage"
          parameters: {}
    features:
      name: "Predador das Sombras"
      desc: "Pode se esconder quando levemente obscurecido; errar um ataque à distância não revela sua posição; penumbra não impõe desvantagem em Percepção (visão)."

  lider_inspirador:
    key_aliases: ["inspiring_leader"]
    name: "Líder Inspirador"
    description: "Você pode gastar 10 minutos inspirando seus companheiros, suportando a vontade deles de lutar. Quando fizer isso, escolha até seis criaturas amigáveis (que pode incluir você) a até 9 metros de você que possam ver ou ouvir você e possam te compreender. Cada criatura ganha pontos de vida temporários igual ao seu nível + seu modificador de Carisma. Uma criatura não pode ganhar pontos de vida temporários desse talento novamente até terminar um descanso curto ou longo."
    prerequisites:
      ability_score: { cha: 13 }
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      temporary_hp_modifiers:
        inspiring_speech:
          implementation: "grant_temp_hp_after_speech"
          parameters:
            cast_time: "10_minutos"
            targets_max: 6
            include_self: true
            amount_formula: { level: "self_level", ability_mod: "cha_mod", sum: true }
            cooldown: { per_target: true, refresh: ["short_rest", "long_rest"] }
    features:
      name: "Discurso Inspirador"
      desc: "Após 10 min, até 6 criaturas (incluindo você) ganham PV temporários iguais ao seu nível + mod. de Carisma; cada criatura só pode receber novamente após descanso curto ou longo."

  resiliente:
    key_aliases: ["resilient"]
    name: "Resiliente"
    description: "<p>Escolha um valor de habilidade. Você ganha os seguintes benefícios:</p><ul><li><p>Aumente o valor de habilidade escolhido em 1, até o máximo de 20.</p></li><li><p>Você ganha proficiência em testes de resistência usando a habilidade escolhida.</p></li></ul>"
    prerequisites: {}
    ability_bonuses:
      choose: { amount: 1, options: ["for", "des", "con", "int", "sab", "car"] }
    proficiency_bonuses: {}
    special_rules:
      skill_modifiers:
        saving_throw_advantage:
          implementation: "saving_throw_advantage"
          parameters: { condition: "atributo_escolhido" }
    features:
      name: "Treinamento em Resistência"
      desc: "+1 em um atributo escolhido e proficiência nos testes de resistência desse atributo."

  explorador_de_cavernas:
    key_aliases: ["dungeon_delver"]
    name: "Explorador de Cavernas"
    description: "<p>Alerta às armadilhas escondidas e portas secretas encontradas em muitas masmorras, você ganha os seguintes benefícios:</p><ul><li><p>Você tem vantagem em testes de Sabedoria (Percepção) e de Inteligência (Investigação) feitos para detectar a presença de portas secretas.</p></li><li><p>Você tem vantagem em testes de resistência feitos para evitar ou resistir a armadilhas.</p></li><li><p>Você tem resistência ao dano causado por armadilhas.</p></li><li><p>Você pode procurar armadilhas enquanto viaja a um ritmo normal, ao invés de metade do ritmo.</p></li></ul>"
    prerequisites: {}
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      skill_modifiers:
        skill_advantage:
          implementation: "skill_advantage"
          parameters: ["Percepção", "Investigação"]
        saving_throw_advantage:
          implementation: "saving_throw_advantage"
          parameters: { condition: "armadilhas" }
      defense_modifiers:
        damage_resistance:
          implementation: "damage_resistance"
          parameters: ["armadilhas"]
      exploration_modifiers:
        search_traps_at_normal_pace:
          implementation: "trap_search_no_slowdown"
          parameters: {}
    features:
      name: "Farejador de Perigos"
      desc: "Vantagem para achar portas secretas; vantagem em salvaguardas contra armadilhas e resistência ao dano delas; pode procurar armadilhas em ritmo normal."

  curandeiro:
    key_aliases: ["healer"]
    name: "Curandeiro"
    description: "<p>Você é um cirurgião capacitado, permitindo que você trate de ferimentos rapidamente, trazendo seus aliados de volta à luta. Você adquire os seguintes benefícios:</p><ul><li><p>Quando você usar um kit de primeiros-socorros para estabilizar uma criatura morrendo, a criatura recupera 1 ponto de vida, ao invés disso.</p></li><li><p>Com uma ação, você pode gastar um uso do kit de primeiros-socorros para tratar de uma criatura e restaurar 1d6 + 4 pontos de vida mais uma quantidade de pontos de vida adicionais igual ao número total de Dados de Vida da criatura. A criatura não pode recuperar pontos de vida através desse talento novamente até ter terminado um descanso curto ou longo.</p></li></ul>"
    prerequisites: {}
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      healing_modifiers:
        stabilize_restores_1hp:
          implementation: "healers_kit_stabilize_plus_1hp"
          parameters: {}
        battle_medic_heal:
          implementation: "healers_kit_restore_hp_action"
          parameters:
            resource: "healers_kit_use"
            heal_formula:
              base_die: "1d6"
              flat_bonus: 4
              plus_target_hd: true
            cooldown: { per_target: true, refresh: ["short_rest", "long_rest"] }
    features:
      name: "Kit de Primeiros Socorros Aprimorado"
      desc: "Ao estabilizar com kit, o alvo recupera 1 PV; como ação, gasta 1 uso do kit para curar 1d6+4 + dados de vida do alvo (1/descanso por alvo)."

  imobilizador:
    key_aliases: ["grappler"]
    name: "Imobilizador"
    description: "<p>Você desenvolveu a perícia necessária para se prender a alguém em um combate engajado. Você recebe os seguintes benefícios:</p><ul><li><p>Você tem vantagem nas jogadas de ataque contra uma criatura agarrada.</p></li><li><p>Você pode usar sua ação para tentar imobilizar uma criatura agarrada por você. Para tanto, realize outro teste de agarrar. Se você for bem sucedido, você é a criatura estará o ambos impedidos até o agarrar terminar.</p></li></ul>"
    prerequisites:
      ability_score: { str: 13 }
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      combat_modifiers:
        advantage_vs_grappled:
          implementation: "advantage_on_attack_vs_grappled_target"
          parameters: {}
        pin_as_action:
          implementation: "attempt_pin_grappled_target"
          parameters:
            result: { attacker: "restrained", target: "restrained" }
            duration: "while_grappled"
            escape: { action: "escape_grapple" }
    features:
      name: "Aperto de Ferro"
      desc: "Vantagem nas jogadas de ataque contra criatura que você esteja agarrando; pode usar ação para tentar imobilizar (ambos ficam Restritos até escape)."

  magico_iniciante:
    key_aliases: ["magic_initiate"]
    name: "Iniciado em Magia"
    description: "<p>Escolha uma classe: bardo, bruxo, clérigo, druida, feiticeiro ou mago. Você aprende dois truques da lista de magias da classe escolhida.</p><p>Além disso, escolha uma magia de 1° nível da mesma lista. Você aprende essa magia e pode conjura-la com o menor nível possível. Uma vez que a conjure, você precisa terminar um descanso longo para poder conjura-la novamente. Essa restrição aplica-se apenas à magia adquirida através desse talento.</p><p>Sua habilidade de conjuração depende da classe que você escolher: Carisma para bardo, bruxo ou feiticeiro; Sabedoria para clérigo ou druida; ou Inteligência para mago.</p>"
    prerequisites: {}
    # PHB 5e: Magic Initiate NAO e half-feat — nao concede +1 atributo. Antes
    # desta correcao, este YAML declarava `choose { amount:1, options:[int,wis,cha] }`,
    # divergindo de feats.yml legacy, de FeatRules::RULES (Ruby) e do front
    # (featsData.ts). A divergencia foi flagrada pela Camada B+
    # (front-lafiga/src/app/data/__tests__/feats.parity.bdd.test.ts).
    ability_bonuses: {}
    proficiency_bonuses: {}
    cantrips:
      choose:
        amount: 2
        class_options: ["mago", "bruxo", "bardo", "clérigo", "druida", "feiticeiro", "paladino", "patrulheiro"]
    spells:
      choose:
        amount: 1
        level: 1
        class_options: ["mago", "bruxo", "bardo", "clérigo", "druida", "feiticeiro", "paladino", "patrulheiro"]
    special_rules:
      magic_modifiers:
        cast_first_level_once:
          implementation: "cast_known_spell_without_slot"
          parameters: { spell_level: 1, uses: 1, recovery: "long_rest", ability: "chosen_class_ability" }
    features:
      name: "Magias Iniciais"
      desc: "Aprende 2 truques e 1 magia de 1º nível da mesma lista escolhida; pode conjurar a magia de 1º nível 1x por descanso longo sem gastar espaço."

  conjurador_de_ritual:
    key_aliases: ["ritual_caster"]
    name: "Conjurador de Ritual"
    description: "<p>Você aprendeu um número de magias que você pode conjurar como rituais. Essas magias são escritas em um livro de rituais, o qual deve estar em suas mãos enquanto você conjura uma dessas magias.</p><p>Quando você escolhe esse talento, você adquire um livro de rituais que contém duas magias de 1º nível, à sua escolha. Escolha uma das seguintes classes: bardo, bruxo, clérigo, druida, feiticeiro ou mago. Você deve escolher suas magias da lista de magias dessa classe e as magias escolhidas devem ter o descritor ritual. A classe que você escolhe também determina a habilidade de conjuração dessas magias: Carisma para bardo, bruxo ou feiticeiro; Sabedoria para clérigo ou druida; ou Inteligência para mago.</p><p>Se você encontrar uma magia na forma escrita, como a contida em um pergaminho de magia ou o grimório de um mago, você é capaz de adicioná-la ao seu livro de rituais. A magia deve estar na lista de magias da classe escolhida, o nível da magia não pode ser maior que metade do seu nível (arredondado para cima) e deve conter o descritor ritual. O processo para copiar a magia no seu livro de rituais leva 2 horas por nível da magia e custa 50 po por nível. O custo representa os componentes materiais que você gasta para experimentar a magia até dominá-la, bem como as finas tintas utilizadas para escrevê-la.</p>"
    prerequisites:
      ability_score:
        int_or_wis: 13
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      magic_modifiers:
        ritual_book:
          implementation: "ritual_book_init"
          parameters: { level: 1, count: 2, class_choice: ["bardo", "bruxo", "clérigo", "druida", "feiticeiro", "mago"] }
        ritual_copying:
          implementation: "copy_ritual_cost"
          parameters: { time_per_level_hours: 2, gold_per_level: 50 }
        ritual_casting:
          implementation: "cast_from_book_as_ritual_only"
          parameters: { requires_book_in_hand: true }
    features:
      name: "Livro de Rituais"
      desc: "Ganha livro com 2 rituais de 1º nível; pode copiar e conjurar como ritual do livro."

  especialista_em_armas:
    key_aliases: ["weapon_master"]
    name: "Mestre de Armas"
    description: "<p>Você tem praticado extensamente com uma variedade de armas, ganhando os seguintes benefícios:</p><ul><li><p>Aumente o valor de Força ou Destreza em 1, até o máximo de 20.</p></li><li><p>Você ganha proficiência com quatro armas simples ou marciais, à sua escolha.</p></li></ul>"
    prerequisites: {}
    ability_bonuses:
      choose: { amount: 1, options: ["str","dex"] }
    proficiency_bonuses:
      weapons:
        choose: { amount: 4, options: ["arma_simples","arma_marcial"] }
    special_rules: {}
    features:
      name: "Domínio de Armas"
      desc: "Você ganha proficiência com quatro armas à sua escolha e +1 em FOR ou DES."

  especialista_em_escudo:
    key_aliases: ["shield_expert"]
    name: "Especialista em Escudo"
    description: "Você desenvolveu uma habilidade especial com escudos."
    prerequisites: {}
    ability_bonuses:
      choose: { amount: 1, options: ["str","dex"] }
    proficiency_bonuses: {}
    special_rules:
      combat_modifiers:
        shield_as_improvised_weapon:
          implementation: "shield_as_improvised_weapon"
          parameters: { damage_die: "1d4", damage_type: "concussão" }
    features:
      name: "Golpes com Escudo"
      desc: "Você pode usar um escudo como arma improvisada (1d4 de dano concussão) e recebe +1 em FOR ou DES."

  alerta:
    key_aliases: ["alert"]
    name: "Alerta"
    description: "<p>Sempre a espera de perigo, você ganha os seguintes benefícios:</p><ul><li><p>Você recebe +5 de bônus em iniciativa.</p></li><li><p>Você não pode ser surpreso enquanto estiver consciente.</p></li><li><p>Outras criaturas não ganham vantagem nas jogadas de ataque contra você por estarem escondidas de você.</p></li></ul>"
    prerequisites: {}
    ability_bonuses: {}
    proficiency_bonuses: {}
    special_rules:
      combat_modifiers:
        initiative_bonus:
          implementation: "initiative_flat_bonus"
          parameters: { bonus: 5 }
        surprise_immunity:
          implementation: "cannot_be_surprised_while_conscious"
          parameters: {}
        hidden_attackers_no_advantage:
          implementation: "hidden_attackers_gain_no_advantage"
          parameters: {}
    features:
      name: "Atenção Constante"
      desc: "+5 em iniciativa; você não pode ser surpreso enquanto estiver consciente; outras criaturas não ganham vantagem em ataques contra você por estarem escondidas."

  mente_agucada:
    key_aliases: ["keen_mind", "mente_afiada"]
    name: "Mente Afiada"
    description: "<p>Você tem uma mente que pode cronometrar o tempo e memorizar direção e detalhes com precisão absurda. Você ganha os seguintes benefícios:</p><ul><li><p>Aumente seu valor de Inteligência em 1, até o máximo de 20.</p></li><li><p>Você sempre sabe qual a direção do norte.</p></li><li><p>Você sempre sabe o número de horas restantes para o próximo nascer ou pôr do sol.</p></li><li><p>Você pode relembrar, com precisão, qualquer coisa que você tenha visto ou ouvido no último mês.</p></li></ul>"
    prerequisites: {}
    ability_bonuses:
      fixed: { int: 1 }
    proficiency_bonuses: {}
    special_rules:
      social_modifiers:
        perfect_recall_30_days:
          implementation: "perfect_recall"
          parameters: { window_days: 30 }
        knows_north:
          implementation: "always_knows_compass_direction"
          parameters: { direction: "north" }
    features:
      name: "Memória Eidética"
      desc: "+1 INT; você sempre sabe a direção do norte; sempre sabe quantas horas faltam para o próximo nascer ou pôr do sol; lembra perfeitamente de qualquer coisa que viu ou ouviu no último mês."
